services:
  codex-web:
    build:
      context: .
      args:
        BASE_IMAGE: ${CODEX_WEB_BASE_IMAGE:-garnser/codex-web:base}
        CODEX_VERSION: ${CODEX_VERSION:-0.160.0}
        CODEX_UID: ${CODEX_UID:-1000}
        CODEX_GID: ${CODEX_GID:-1000}
    image: ${CODEX_WEB_IMAGE:-codex-web:local}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/api/livez', timeout=2).read()"]
      interval: 15s
      timeout: 3s
      start_period: 20s
      retries: 4
    env_file:
      - path: .env
        required: false
    environment:
      CODEX_WEB_HOST: 0.0.0.0
      CODEX_WEB_PORT: 8765
      CODEX_WEB_WORKSPACE_ROOT: /workspace
      CODEX_WEB_WORKSPACE_SOURCE_ROOT: ${CODEX_WORKSPACE:-}
    ports:
      - "${CODEX_WEB_BIND:-127.0.0.1}:${CODEX_WEB_PORT:-8765}:8765"
    volumes:
      - codex-web-data:/app/data
      - codex-home:/home/codex/.codex
      - ${CODEX_WORKSPACE:-./workspace}:/workspace
    stop_grace_period: 15s

volumes:
  codex-web-data:
  codex-home:
