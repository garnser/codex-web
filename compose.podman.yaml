# Rootless Podman qualification overlay for the local Bubblewrap execution worker.
#
# Use with:
#   podman compose -f compose.yaml -f compose.podman.yaml up -d
#
# Rootless Podman remains unprivileged on the host. seccomp=unconfined relaxes
# the outer container syscall filter so the non-root codex user can create the
# nested user/PID/mount/network namespaces enforced by Bubblewrap.
services:
  codex-web:
    environment:
      CODEX_WEB_EXECUTION_CONTAINER_PROFILE: rootless-podman-bwrap
    security_opt:
      - seccomp=unconfined
      - label=disable
