name: shrink-watchdog-dispatch

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  shrink:
    if: github.event.pull_request.head.ref == 'refactor/watchdog-dispatch-policy'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out PR branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock

      - name: Generate watchdog dispatch migration
        run: python .github/scripts/shrink_watchdog_dispatch.py

      - name: Run focused tests
        run: |
          python -m unittest discover -s tests -p 'test_watchdog_dispatch.py'
          python -m unittest discover -s tests -p 'test_core_budget.py'

      - name: Commit generated migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated migration changes"
            exit 0
          fi
          git commit -m "Generate watchdog dispatch ownership migration"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
