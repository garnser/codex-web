name: shrink-thread-message-limits

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  shrink:
    if: github.head_ref == 'refactor/thread-message-limits'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Generate shrink
        run: python tools/shrink_thread_message_limits.py
      - name: Verify legacy-core ratchet
        run: python -m unittest tests.test_core_budget
      - name: Commit generated shrink
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Delete ThreadService-owned message helpers from legacy core"
          git push
