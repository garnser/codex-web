name: publish-release

on:
  push:
    branches:
      - main
    paths:
      - .release-version
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  publish:
    name: dockerhub-release
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve and validate release version
        id: release
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < .release-version)"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Invalid release version: $version" >&2
            exit 1
          fi
          tag="v${version}"
          existing="$(git ls-remote origin "refs/tags/${tag}" | awk '{print $1}')"
          if [ -n "$existing" ]; then
            echo "Tag ${tag} already exists; refusing to retag." >&2
            exit 1
          fi
          codex_version="$(awk -F= '$1 == "CODEX_VERSION" {print $2}' .env.example)"
          test -n "$codex_version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "codex_version=$codex_version" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull trusted runtime base
        run: docker pull garnser/codex-web:base

      - name: Build production image
        shell: bash
        env:
          IMAGE: garnser/codex-web
          VERSION: ${{ steps.release.outputs.version }}
          TAG: ${{ steps.release.outputs.tag }}
          CODEX_VERSION: ${{ steps.release.outputs.codex_version }}
        run: |
          set -euo pipefail
          docker build \
            --build-arg BASE_IMAGE=garnser/codex-web:base \
            --build-arg "CODEX_VERSION=${CODEX_VERSION}" \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.version=${TAG}" \
            --tag "${IMAGE}:${VERSION}" \
            --tag "${IMAGE}:${TAG}" \
            --tag "${IMAGE}:sha-${GITHUB_SHA}" \
            --tag "${IMAGE}:latest" \
            .

      - name: Verify pinned Codex version
        shell: bash
        env:
          IMAGE: garnser/codex-web
          VERSION: ${{ steps.release.outputs.version }}
          CODEX_VERSION: ${{ steps.release.outputs.codex_version }}
        run: |
          set -euo pipefail
          actual="$(docker run --rm --entrypoint codex "${IMAGE}:${VERSION}" --version)"
          echo "Expected Codex ${CODEX_VERSION}; production image reports: ${actual}"
          printf '%s' "$actual" | grep -F "$CODEX_VERSION"

      - name: Smoke-test production image
        shell: bash
        env:
          IMAGE: garnser/codex-web
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          docker run --detach \
            --name codex-web-release-smoke \
            --publish 127.0.0.1:18765:8765 \
            "${IMAGE}:${VERSION}"
          trap 'docker logs codex-web-release-smoke || true; docker rm --force codex-web-release-smoke >/dev/null 2>&1 || true' EXIT

          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:18765/api/livez >/dev/null; then
              exit 0
            fi
            if ! docker inspect --format '{{.State.Running}}' codex-web-release-smoke | grep -q true; then
              echo 'Production image exited before becoming live' >&2
              exit 1
            fi
            sleep 1
          done

          echo 'Production image did not become live' >&2
          exit 1

      - name: Push production image tags
        shell: bash
        env:
          IMAGE: garnser/codex-web
          VERSION: ${{ steps.release.outputs.version }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          docker push "${IMAGE}:${VERSION}"
          docker push "${IMAGE}:${TAG}"
          docker push "${IMAGE}:sha-${GITHUB_SHA}"
          docker push "${IMAGE}:latest"
          docker buildx imagetools inspect "${IMAGE}:${VERSION}"

      - name: Create Git tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f "ref=refs/tags/${TAG}" \
            -f "sha=${GITHUB_SHA}"

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            --verify-tag \
            --title "codex-web ${TAG}" \
            --generate-notes
