name: legacy-system-integration-routes-shrink-once

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  rewrite:
    if: github.event.pull_request.head.ref == 'refactor/shrink-legacy-core-system-integration-routes'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out cleanup branch
        uses: actions/checkout@v7
        with:
          ref: refactor/shrink-legacy-core-system-integration-routes
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Remove extracted system and integration route definitions
        run: python tools/shrink_legacy_system_integration_routes_once.py
      - name: Commit generated shrink and remove helpers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/legacy-system-integration-routes-shrink-once.yml tools/shrink_legacy_system_integration_routes_once.py
          git add codex_web/runtime/legacy_core.py tests/test_core_budget.py
          git diff --cached --check
          git commit -m 'Delete extracted legacy system and integration API routes [legacy-system-integration-route-shrink]'
          git push origin HEAD:refactor/shrink-legacy-core-system-integration-routes
