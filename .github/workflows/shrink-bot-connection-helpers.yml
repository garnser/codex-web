name: shrink-bot-connection-helpers

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  shrink:
    if: github.head_ref == 'refactor/bot-connection-service'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Generate shrink
        run: python tools/shrink_bot_connection_helpers.py
      - name: Focused validation
        run: python -m unittest tests.test_bot_connection_service tests.test_application_composition tests.test_core_budget
      - name: Commit generated shrink
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Move bot connection helpers out of legacy core"
          git push
