name: legacy-shrink-once

on:
  push:
    branches:
      - refactor/shrink-legacy-core-recovery-state

permissions:
  contents: write

jobs:
  rewrite:
    if: github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, '[legacy-shrink]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: refactor/shrink-legacy-core-recovery-state

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Remove extracted legacy definitions
        run: python tools/shrink_legacy_core_once.py

      - name: Commit generated shrink
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add codex_web/runtime/legacy_core.py tests/test_core_budget.py
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No shrink changes produced.'
            exit 1
          fi
          git commit -m 'Delete extracted legacy runtime implementations [legacy-shrink]'
          git push origin HEAD:refactor/shrink-legacy-core-recovery-state
