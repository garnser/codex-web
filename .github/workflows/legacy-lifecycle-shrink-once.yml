name: legacy-lifecycle-shrink-once

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  rewrite:
    if: github.event.pull_request.head.ref == 'refactor/shrink-legacy-core-lifecycle'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out cleanup branch
        uses: actions/checkout@v7
        with:
          ref: refactor/shrink-legacy-core-lifecycle

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Remove extracted lifecycle definitions
        run: python tools/shrink_legacy_lifecycle_once.py

      - name: Commit generated shrink and remove helpers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/legacy-lifecycle-shrink-once.yml tools/shrink_legacy_lifecycle_once.py
          git add codex_web/runtime/legacy_core.py tests/test_core_budget.py
          git diff --cached --check
          git commit -m 'Delete extracted legacy lifecycle implementations [legacy-lifecycle-shrink]'
          git push origin HEAD:refactor/shrink-legacy-core-lifecycle
