name: tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: unit-static
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install locked Python dependencies
        run: python -m pip install -r requirements.lock

      - name: Run Python tests
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Syntax-check frontend JavaScript
        shell: bash
        run: |
          set -euo pipefail
          for script in static/*.js; do
            node --check "$script"
          done


  gitlab-sync-qualification:
    name: gitlab-sync-qualification
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install locked Python dependencies
        run: python -m pip install -r requirements.lock

      - name: Qualify large-state GitLab sync complexity and responsiveness
        run: python -m unittest tests.test_gitlab_sync_scaling

  explicit-repository-target-qualification:
    name: explicit-repository-target-qualification
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked qualification dependencies
        run: |
          python -m pip install -r requirements.lock
          npm ci
          npx playwright install chromium

      - name: Qualify explicit per-turn repository targeting and isolation
        run: |
          python -m unittest \
            tests.test_explicit_repository_target_qualification \
            tests.test_project_readiness.ProjectReadinessTests.test_explicit_multi_repository_policy_is_ready_without_default

      - name: Qualify coordinated multi-repository execution invariants
        run: |
          python -m unittest \
            tests.test_turn_execution_binding.TurnExecutionBindingTests.test_single_writable_collection_preserves_single_repository_semantics \
            tests.test_turn_execution_binding.TurnExecutionBindingTests.test_work_item_coordinated_scope_keeps_selection_provenance \
            tests.test_turn_execution_binding.TurnExecutionBindingTests.test_coordinated_writable_scope_is_persisted_atomically \
            tests.test_turn_execution_binding.TurnExecutionBindingTests.test_invalid_coordinated_scope_fails_before_workspace_or_assignment \
            tests.test_execution_workspaces.ExecutionWorkspaceTests.test_coordinated_workspace_provisions_multiple_writable_members \
            tests.test_execution_workspaces.ExecutionWorkspaceTests.test_coordinated_integration_is_recorded_per_repository \
            tests.test_work_item_runs.WorkItemRunProjectionTests.test_coordinated_repository_scope_is_projected_on_run_summary \
            tests.test_work_item_runs.WorkItemRunProjectionTests.test_repository_outcomes_are_projected_from_canonical_workspace_state \
            tests.test_artifact_evidence.ArtifactEvidenceTests.test_evidence_can_carry_repository_resource_attribution \
            tests.test_action_intents.ActionIntentTests.test_execution_bound_repository_action_must_stay_in_writable_scope \
            tests.test_action_intents.ActionIntentTests.test_execution_bound_repository_action_requires_assignment_state

      - name: Qualify repository target browser provenance and blockers
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 18766 --bind 127.0.0.1 > /tmp/codex-web-repository-target.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" >/dev/null 2>&1 || true; cat /tmp/codex-web-repository-target.log || true' EXIT

          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18766/static/index.html >/dev/null; then
              break
            fi
            sleep 0.2
          done

          npx playwright test \
            tests/browser/repository_target_ui.spec.js \
            tests/browser/execution_preflight.spec.js \
            --workers=1 \
            --reporter=line

  distributed:
    name: distributed-backends
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: codex
          POSTGRES_PASSWORD: codex
          POSTGRES_DB: codex
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U codex -d codex"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15

      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15

    env:
      CODEX_WEB_TEST_POSTGRES_DSN: postgresql://codex:codex@127.0.0.1:5432/codex
      CODEX_WEB_TEST_REDIS_URL: redis://127.0.0.1:6379/15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-distributed.txt

      - name: Install locked core and distributed dependencies
        run: |
          python -m pip install -r requirements.lock
          python -m pip install -r requirements-distributed.txt

      - name: Exercise PostgreSQL and Redis replicated semantics
        run: python -m unittest tests.test_distributed_backends

  browser:
    name: chromium
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked browser test dependencies
        run: npm ci

      - name: Restore Playwright browser cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Ensure Chromium browser runtime is installed
        run: npx playwright install chromium

      - name: Run frontend browser tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 18766 --bind 127.0.0.1 > /tmp/codex-web-static.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" >/dev/null 2>&1 || true; cat /tmp/codex-web-static.log || true' EXIT

          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18766/static/index.html >/dev/null; then
              break
            fi
            sleep 0.2
          done

          npx playwright test tests/browser --workers=1 --reporter=line

      - name: Upload browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-diagnostics
          path: test-results/
          if-no-files-found: warn

      - name: Generate sanitized documentation screenshots
        run: npm run docs:screenshots

      - name: Upload documentation screenshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: documentation-screenshots
          path: docs/assets/screenshots/generated/
          if-no-files-found: error

  docker:
    name: docker-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Log in to Docker Hub for authenticated pulls
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Validate Compose configuration
        run: docker compose config

      - name: Validate recovery Compose/nginx configuration
        shell: bash
        env:
          CODEX_WEB_IMAGE: codex-web:test
        run: |
          set -euo pipefail
          docker compose \
            -f compose.yaml \
            -f compose.recovery.yaml \
            config >/tmp/recovery-compose.yaml
          grep -F 'deploy/recovery/nginx.conf' /tmp/recovery-compose.yaml

      - name: Select runtime base
        id: runtime-base
        shell: bash
        run: |
          set -euo pipefail
          expected="$(awk -F= '$1 == "CODEX_VERSION" {print $2}' .env.example)"
          test -n "$expected"

          if git rev-parse HEAD^1 >/dev/null 2>&1; then
            parent=HEAD^1
          else
            parent="$(git hash-object -t tree /dev/null)"
          fi

          base_changed=false
          changed_files="$(git diff --name-only "$parent" HEAD 2>/dev/null || true)"
          if printf '%s\n' "$changed_files" | grep -Eq '^(Dockerfile\.base|requirements\.txt|requirements\.lock|\.github/workflows/publish-base-image\.yml)$'; then
            base_changed=true
          elif git diff "$parent" HEAD -- .env.example 2>/dev/null | grep -Eq '^[+-]CODEX_VERSION='; then
            base_changed=true
          fi

          if [ "$base_changed" = true ]; then
            echo 'Runtime base inputs changed; cold-building candidate base for this revision.'
            docker build \
              --file Dockerfile.base \
              --build-arg "CODEX_VERSION=${expected}" \
              --tag codex-web-base:test \
              .
            base_image=codex-web-base:test
            echo 'mode=candidate' >> "$GITHUB_OUTPUT"
          else
            echo 'Runtime base inputs unchanged; pulling trusted Docker Hub base.'
            docker pull garnser/codex-web:base
            base_image=garnser/codex-web:base
            echo 'mode=published' >> "$GITHUB_OUTPUT"
          fi

          echo "base_image=${base_image}" >> "$GITHUB_OUTPUT"
          echo "codex_version=${expected}" >> "$GITHUB_OUTPUT"

      - name: Build application image
        shell: bash
        env:
          BASE_IMAGE: ${{ steps.runtime-base.outputs.base_image }}
          CODEX_VERSION: ${{ steps.runtime-base.outputs.codex_version }}
        run: |
          set -euo pipefail
          docker build \
            --build-arg "BASE_IMAGE=${BASE_IMAGE}" \
            --build-arg "CODEX_VERSION=${CODEX_VERSION}" \
            --build-arg "CODEX_WEB_RELEASE_VERSION=ci" \
            --build-arg "CODEX_WEB_GIT_REVISION=${GITHUB_SHA}" \
            --tag codex-web:test \
            .

      - name: Verify pinned Codex version
        run: |
          expected="$(awk -F= '$1 == "CODEX_VERSION" {print $2}' .env.example)"
          actual="$(docker run --rm --entrypoint codex codex-web:test --version)"
          echo "Expected Codex ${expected}; image reports: ${actual}"
          printf '%s' "$actual" | grep -F "$expected"

      - name: Smoke-test container liveness
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --name codex-web-smoke --publish 127.0.0.1:18765:8765 codex-web:test
          trap 'docker logs codex-web-smoke || true; docker rm --force codex-web-smoke >/dev/null 2>&1 || true' EXIT

          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:18765/api/livez >/dev/null; then
              version="$(curl --fail --silent --show-error http://127.0.0.1:18765/api/version)"
              jq -e --arg revision "$GITHUB_SHA" '
                .releaseVersion == "ci" and .gitRevision == $revision
              ' <<<"$version" >/dev/null
              exit 0
            fi
            if ! docker inspect --format '{{.State.Running}}' codex-web-smoke | grep -q true; then
              echo 'Container exited before becoming live' >&2
              exit 1
            fi
            sleep 1
          done

          echo 'Container did not become live' >&2
          exit 1

      - name: Qualify clean-install onboarding through Compose and public APIs
        shell: bash
        run: |
          set -euo pipefail
          workspace=/tmp/codex-web-onboarding-workspace
          artifacts=/tmp/codex-web-onboarding-artifacts
          rm -rf "$workspace" "$artifacts"
          mkdir -p \
            "$workspace/onboarding-single" \
            "$workspace/onboarding-multi/app" \
            "$workspace/onboarding-multi/platform" \
            "$workspace/onboarding-no-worker" \
            "$artifacts"

          init_repo() {
            local path="$1"
            git -C "$path" init -q
            git -C "$path" config user.name "Codex Web CI"
            git -C "$path" config user.email "codex-web-ci@example.invalid"
            printf '# qualification\n' > "$path/README.md"
            git -C "$path" add README.md
            git -C "$path" commit -q -m "qualification fixture"
          }

          init_repo "$workspace/onboarding-single"
          init_repo "$workspace/onboarding-multi/app"
          init_repo "$workspace/onboarding-multi/platform"
          init_repo "$workspace/onboarding-no-worker"
          printf 'must remain unchanged\n' > "$workspace/workspace-sentinel.txt"
          sentinel_before="$(sha256sum "$workspace/workspace-sentinel.txt" | awk '{print $1}')"
          chmod -R a+rX,u+w "$workspace"

          export CODEX_WEB_IMAGE=codex-web:test
          export CODEX_WORKSPACE="$workspace"
          export CODEX_WEB_BIND=127.0.0.1
          export CODEX_WEB_PORT=18767
          export BASE_URL=http://127.0.0.1:18767

          cleanup() {
            docker compose -p codex-web-onboarding logs --no-color > "$artifacts/compose.log" 2>&1 || true
            docker compose -p codex-web-onboarding down -v --remove-orphans >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker compose -p codex-web-onboarding up -d --no-build
          bash scripts/qualify-clean-install-onboarding.sh qualify \
            | tee "$artifacts/qualification.json"

          sentinel_after="$(sha256sum "$workspace/workspace-sentinel.txt" | awk '{print $1}')"
          test "$sentinel_before" = "$sentinel_after"

          docker compose -p codex-web-onboarding restart codex-web
          bash scripts/qualify-clean-install-onboarding.sh verify-restart \
            | tee "$artifacts/restart.json"

      - name: Qualify deterministic first-thread execution substitute
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --entrypoint python \
            codex-web:test \
            -m unittest \
            tests.test_fresh_project_bootstrap \
            tests.test_thread_bootstrap_routing

      - name: Upload clean-install onboarding evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clean-install-onboarding
          path: /tmp/codex-web-onboarding-artifacts/
          if-no-files-found: warn

  podman-worker:
    name: rootless-podman-worker
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install rootless Podman prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y podman uidmap slirp4netns fuse-overlayfs

      - name: Positive rootless Podman smoke
        shell: bash
        run: |
          set -euo pipefail
          test "$(podman info --format '{{.Host.Security.Rootless}}')" = "true"
          podman run --rm docker.io/library/debian:bookworm-slim /bin/true

      - name: Build non-root Bubblewrap qualification image
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/Containerfile.codex-bwrap <<'EOF'
          FROM debian:bookworm-slim
          RUN apt-get update \
              && apt-get install -y --no-install-recommends bubblewrap \
              && useradd --uid 1000 --create-home --shell /bin/sh codex \
              && rm -rf /var/lib/apt/lists/*
          USER codex
          EOF
          podman build \
            --file /tmp/Containerfile.codex-bwrap \
            --tag localhost/codex-bwrap-probe:test \
            /tmp

      - name: Verify unsupported nested Bubblewrap fails closed
        shell: bash
        run: |
          set -euo pipefail
          set +e
          output="$(
            podman run --rm \
              --security-opt seccomp=unconfined \
              --security-opt label=disable \
              localhost/codex-bwrap-probe:test \
              bwrap \
                --die-with-parent \
                --new-session \
                --unshare-user \
                --unshare-pid \
                --unshare-uts \
                --unshare-ipc \
                --unshare-net \
                --ro-bind /usr /usr \
                --symlink usr/bin /bin \
                --symlink usr/lib /lib \
                --proc /proc \
                --dev /dev \
                --tmpfs /tmp \
                -- /bin/true 2>&1
          )"
          status=$?
          set -e
          test "$status" -ne 0
          printf '%s\n' "$output"
          printf '%s' "$output" | grep -E \
            "Can't mount proc|Operation not permitted|Unexpected capabilities"

      - name: Verify capability escalation is not treated as supported fallback
        shell: bash
        run: |
          set -euo pipefail
          set +e
          output="$(
            podman run --rm \
              --cap-add SYS_ADMIN \
              --security-opt seccomp=unconfined \
              --security-opt label=disable \
              localhost/codex-bwrap-probe:test \
              bwrap \
                --die-with-parent \
                --new-session \
                --unshare-user \
                --unshare-pid \
                --unshare-uts \
                --unshare-ipc \
                --unshare-net \
                --ro-bind /usr /usr \
                --symlink usr/bin /bin \
                --symlink usr/lib /lib \
                --proc /proc \
                --dev /dev \
                --tmpfs /tmp \
                -- /bin/true 2>&1
          )"
          status=$?
          set -e
          test "$status" -ne 0
          printf '%s\n' "$output"
          printf '%s' "$output" | grep -E \
            "Unexpected capabilities|Operation not permitted|Can't mount proc"

