name: tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: unit-static
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install locked Python dependencies
        run: python -m pip install -r requirements.lock

      - name: Run Python tests
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Syntax-check frontend JavaScript
        shell: bash
        run: |
          set -euo pipefail
          for script in static/*.js; do
            node --check "$script"
          done

  browser:
    name: chromium
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked browser test dependencies
        run: npm ci

      - name: Restore Playwright browser cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Ensure Chromium browser runtime is installed
        run: npx playwright install chromium

      - name: Run frontend browser tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 18766 --bind 127.0.0.1 > /tmp/codex-web-static.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" >/dev/null 2>&1 || true; cat /tmp/codex-web-static.log || true' EXIT

          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18766/static/index.html >/dev/null; then
              break
            fi
            sleep 0.2
          done

          npx playwright test tests/browser --workers=1 --reporter=line

  docker:
    name: docker-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Log in to Docker Hub for authenticated pulls
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Validate Compose configuration
        run: docker compose config

      - name: Select runtime base
        id: runtime-base
        shell: bash
        run: |
          set -euo pipefail
          expected="$(awk -F= '$1 == "CODEX_VERSION" {print $2}' .env.example)"
          test -n "$expected"

          if git rev-parse HEAD^1 >/dev/null 2>&1; then
            parent=HEAD^1
          else
            parent="$(git hash-object -t tree /dev/null)"
          fi

          base_changed=false
          changed_files="$(git diff --name-only "$parent" HEAD 2>/dev/null || true)"
          if printf '%s\n' "$changed_files" | grep -Eq '^(Dockerfile\.base|requirements\.txt|requirements\.lock|\.github/workflows/publish-base-image\.yml)$'; then
            base_changed=true
          elif git diff "$parent" HEAD -- .env.example 2>/dev/null | grep -Eq '^[+-]CODEX_VERSION='; then
            base_changed=true
          fi

          if [ "$base_changed" = true ]; then
            echo 'Runtime base inputs changed; cold-building candidate base for this revision.'
            docker build \
              --file Dockerfile.base \
              --build-arg "CODEX_VERSION=${expected}" \
              --tag codex-web-base:test \
              .
            base_image=codex-web-base:test
            echo 'mode=candidate' >> "$GITHUB_OUTPUT"
          else
            echo 'Runtime base inputs unchanged; pulling trusted Docker Hub base.'
            docker pull garnser/codex-web:base
            base_image=garnser/codex-web:base
            echo 'mode=published' >> "$GITHUB_OUTPUT"
          fi

          echo "base_image=${base_image}" >> "$GITHUB_OUTPUT"
          echo "codex_version=${expected}" >> "$GITHUB_OUTPUT"

      - name: Build application image
        shell: bash
        env:
          BASE_IMAGE: ${{ steps.runtime-base.outputs.base_image }}
          CODEX_VERSION: ${{ steps.runtime-base.outputs.codex_version }}
        run: |
          set -euo pipefail
          docker build \
            --build-arg "BASE_IMAGE=${BASE_IMAGE}" \
            --build-arg "CODEX_VERSION=${CODEX_VERSION}" \
            --tag codex-web:test \
            .

      - name: Verify pinned Codex version
        run: |
          expected="$(awk -F= '$1 == "CODEX_VERSION" {print $2}' .env.example)"
          actual="$(docker run --rm --entrypoint codex codex-web:test --version)"
          echo "Expected Codex ${expected}; image reports: ${actual}"
          printf '%s' "$actual" | grep -F "$expected"

      - name: Smoke-test container liveness
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --name codex-web-smoke --publish 127.0.0.1:18765:8765 codex-web:test
          trap 'docker logs codex-web-smoke || true; docker rm --force codex-web-smoke >/dev/null 2>&1 || true' EXIT

          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:18765/api/livez >/dev/null; then
              exit 0
            fi
            if ! docker inspect --format '{{.State.Running}}' codex-web-smoke | grep -q true; then
              echo 'Container exited before becoming live' >&2
              exit 1
            fi
            sleep 1
          done

          echo 'Container did not become live' >&2
          exit 1
