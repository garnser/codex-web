name: Prune extracted runtime implementations

on:
  push:
    branches:
      - refactor/prune-core-and-budget

permissions:
  contents: write

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/prune-core-and-budget
          fetch-depth: 0

      - name: Remove extracted implementations and add core budget
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import ast
          from pathlib import Path

          core_path = Path('codex_web/runtime/core.py')
          source = core_path.read_text()
          tree = ast.parse(source)

          remove_names = {
              '_send_bot_outbound',
              '_send_bot_details',
              '_record_bot_outbound',
              '_record_bot_approval_request',
              '_update_slack_approval_messages',
              '_resolve_approval_request',
              '_handle_slack_interaction',
              '_handle_bot_inbound',
              'BotRuntime',
              '_enqueue_turn',
              '_find_duplicate_queued_turn',
              '_pop_next_queued_turn',
              '_pop_latest_queued_turn',
              '_pop_queued_turn',
              '_requeue_turn_front',
              '_thread_is_active',
              '_mark_thread_active',
              '_clear_thread_active',
              '_record_thread_activity',
              '_terminal_failure_window_seconds',
              '_schedule_terminal_thread_recovery',
              '_record_terminal_turn_result',
              '_publish_queue_status',
              '_start_thread_turn_now',
              '_drain_thread_queue',
              '_schedule_queue_drain',
              '_resume_active_threads_after_startup',
          }

          nodes = {
              node.name: node
              for node in tree.body
              if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef, ast.ClassDef))
              and node.name in remove_names
          }
          missing = sorted(remove_names - nodes.keys())
          if missing:
              raise SystemExit(f'Expected removable core definitions were not found: {missing}')

          lines = source.splitlines(keepends=True)
          ranges = sorted(
              ((node.lineno - 1, node.end_lineno) for node in nodes.values()),
              reverse=True,
          )
          for start, end in ranges:
              while end < len(lines) and not lines[end].strip():
                  end += 1
              del lines[start:end]
          pruned = ''.join(lines)
          old = 'bot_runtime = BotRuntime()'
          if old not in pruned:
              raise SystemExit('Legacy bot_runtime constructor not found')
          core_path.write_text(pruned.replace(old, 'bot_runtime: Any = None', 1))

          app_path = Path('codex_web/application.py')
          app = app_path.read_text()
          import_anchor = 'from codex_web.runtime import core\n'
          runtime_import = 'from codex_web.runtime.bots import install_bot_runtime\n'
          if runtime_import not in app:
              if import_anchor not in app:
                  raise SystemExit('application.py runtime import anchor not found')
              app = app.replace(import_anchor, import_anchor + runtime_import, 1)
          install_anchor = 'bot_delivery_service = install_bot_delivery_service(\n'
          install_block = (
              'bot_runtime = install_bot_runtime(\n'
              '    app,\n'
              '    core,\n'
              '    slack_client=slack_client,\n'
              '    telegram_client=telegram_client,\n'
              ')\n'
          )
          if 'bot_runtime = install_bot_runtime(' not in app:
              if install_anchor not in app:
                  raise SystemExit('application.py bot delivery anchor not found')
              app = app.replace(install_anchor, install_block + install_anchor, 1)
          app_path.write_text(app)

          size = core_path.stat().st_size
          budget = ((size + 4095) // 4096) * 4096
          Path('tests/test_core_budget.py').write_text(f'''from __future__ import annotations

import ast
import unittest
from pathlib import Path

CORE_PATH = Path(__file__).resolve().parents[1] / "codex_web" / "runtime" / "core.py"
MAX_CORE_BYTES = {budget}
REMOVED_RUNTIME_DEFINITIONS = {sorted(remove_names)!r}

class CoreBudgetTests(unittest.TestCase):
    def test_core_stays_below_ratchet_budget(self) -> None:
        size = CORE_PATH.stat().st_size
        self.assertLessEqual(size, MAX_CORE_BYTES, f"core.py grew to {{size}} bytes; budget is {{MAX_CORE_BYTES}}. Extract new behavior instead of adding it back to core.py.")

    def test_extracted_runtime_definitions_do_not_return(self) -> None:
        tree = ast.parse(CORE_PATH.read_text())
        top_level = {{node.name for node in tree.body if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef, ast.ClassDef))}}
        returned = sorted(set(REMOVED_RUNTIME_DEFINITIONS) & top_level)
        self.assertEqual(returned, [], f"Extracted runtime definitions returned to core.py: {{returned}}")

if __name__ == "__main__":
    unittest.main()
''')
          print(f'Pruned core.py to {size} bytes; ratchet budget={budget} bytes')
          PY

          rm .github/workflows/prune-core-runtime.yml

      - name: Commit pruning result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --stat
          git commit -m 'Delete extracted bot and turn runtime code from core'
          git push origin HEAD:refactor/prune-core-and-budget
