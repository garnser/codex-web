name: shrink-thread-index-helpers

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  shrink:
    if: github.head_ref == 'fix/thread-index-ownership'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
      - name: Generate ownership migration
        run: python tools/shrink_thread_index_helpers.py
      - name: Run focused tests
        run: python -m unittest tests.test_thread_index_repository tests.test_core_budget
      - name: Commit generated migration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Install thread index repository and delete legacy helpers"
          git push
