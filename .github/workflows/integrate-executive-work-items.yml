name: Integrate Executive with canonical work items

on:
  push:
    branches:
      - feature/executive-agent-contracts

permissions:
  contents: write

jobs:
  integrate:
    if: github.event.head_commit.message != 'Integrate Open Executive with canonical work items'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/executive-agent-contracts
      - name: Integrate contracts with canonical GitLab work-item flow
        run: |
          cat > /tmp/integrate.py <<'PY'
          from pathlib import Path

          # Extend role mapping with canonical work-item ownership/stage routing.
          p = Path('codex_web/execution_contracts.py')
          s = p.read_text()
          marker = '\n\nOWNER_TO_EXECUTION_ROLE = {'
          if marker not in s:
              s += '''\n\nOWNER_TO_EXECUTION_ROLE = {\n    "orchestrator": "orchestrator",\n    "release manager": "release-manager",\n    "james": "james",\n    "dana": "dana",\n    "quinn": "quinn",\n    "carl": "carl",\n    "larry": "larry",\n    "white hacker": "white-hacker",\n    "maya": "maya",\n    "nora": "nora",\n    "compliance manager": "compliance-manager",\n    "riley": "riley",\n    "tom": "tom",\n    "janice": "janice",\n    "sally": "sally",\n}\n\n\ndef _normalized_owner(owner: str | None) -> str:\n    return re.sub(r"\\s+", " ", (owner or "").strip().lower().replace("_", " ").replace("-", " "))\n\n\ndef execution_role_for_agent(agent: str | None) -> ExecutionRoleContract | None:\n    role_id = OWNER_TO_EXECUTION_ROLE.get(_normalized_owner(agent))\n    return ROLE_CONTRACTS.get(role_id) if role_id else None\n\n\ndef execution_agent_key(role: ExecutionRoleContract | str) -> str:\n    role_id = role.id if isinstance(role, ExecutionRoleContract) else role\n    for owner, mapped_role_id in OWNER_TO_EXECUTION_ROLE.items():\n        if mapped_role_id == role_id:\n            return owner\n    return str(role_id).replace("-", " ")\n\n\ndef execution_role_for_work_item(state: Any, *, split_brain: bool = False) -> ExecutionRoleContract:\n    if split_brain:\n        return ROLE_CONTRACTS["orchestrator"]\n\n    handoff = getattr(state, "handoff", None)\n    if handoff is not None and getattr(handoff, "status", None) == "pending":\n        recipient_role = execution_role_for_agent(getattr(handoff, "to_agent", None))\n        if recipient_role is not None:\n            return recipient_role\n\n    owner = getattr(state, "current_owner", None) or getattr(state, "next_owner", None)\n    owner_role = execution_role_for_agent(owner)\n    if owner_role is not None:\n        return owner_role\n\n    stage = str(getattr(state, "current_stage", "") or "").strip().lower()\n    if stage in {"ready_for_validation", "validation_running"}:\n        validation_role = execution_role_for_agent(getattr(state, "validation_owner", None))\n        return validation_role or ROLE_CONTRACTS["quinn"]\n    if stage == "ready_to_close" and bool(getattr(state, "release_gate", False)):\n        release_role = execution_role_for_agent(getattr(state, "release_owner", None))\n        return release_role or ROLE_CONTRACTS["release-manager"]\n    if stage == "failed_with_action_owner":\n        action_role = execution_role_for_agent(getattr(state, "next_owner", None))\n        if action_role is not None:\n            return action_role\n    return ROLE_CONTRACTS["orchestrator"]\n'''
              p.write_text(s)

          # Open Executive: existing work items route from canonical state and dispatch to the existing agent binding.
          p = Path('codex_web/executive.py')
          s = p.read_text()
          old = '''    execution_contract_prompt,\n    execution_role,\n    execution_role_catalog_prompt,\n    route_execution_role,\n)'''
          new = '''    execution_agent_key,\n    execution_contract_prompt,\n    execution_role,\n    execution_role_catalog_prompt,\n    execution_role_for_work_item,\n    route_execution_role,\n)'''
          if old not in s: raise SystemExit('executive import anchor missing')
          s = s.replace(old, new, 1)

          old = '''    execution_role_id: str | None = None\n    change_classification: Literal["cosmetic-only", "localized functional", "shared-surface", "release/security-sensitive"] | None = None\n    project_id: str = "home"'''
          new = '''    execution_role_id: str | None = None\n    work_item_ref: str | None = None\n    change_classification: Literal["cosmetic-only", "localized functional", "shared-surface", "release/security-sensitive"] | None = None\n    project_id: str = "home"'''
          if old not in s: raise SystemExit('delegate fields anchor missing')
          s = s.replace(old, new, 1)

          delegate_marker = '''    async def delegate(self, request: DelegateRequest) -> dict[str, Any]:\n'''
          helper = '''    async def _delegate_canonical_work_item(\n        self,\n        request: DelegateRequest,\n        agent: ExecutiveAgent,\n        execution_role_contract: ExecutionRoleContract,\n        state: Any,\n        project: Any,\n    ) -> dict[str, Any]:\n        agent_key = execution_agent_key(execution_role_contract)\n        binding = self.host._binding_for_agent(\n            agent_key,\n            project.id,\n            preferred_conversation_id=getattr(self.host, "HANDOFF_COORDINATION_CHANNEL", None),\n        )\n        if binding is None:\n            raise HTTPException(\n                status_code=409,\n                detail=(\n                    f"Canonical work item {state.ref} routes to {execution_role_contract.name}, "\n                    f"but no active codex-web agent binding exists for {agent_key!r} in project {project.id}. "\n                    "Repair the agent binding or reroute the work item through Orchestrator; Open Executive will not "\n                    "create a parallel owner thread for an existing canonical item."\n                ),\n            )\n\n        recommendation = request.executive_reply.strip()\n        classification = request.change_classification or "agent must classify before substantive work"\n        canonical_prompt = self.host._work_item_dispatch_text(state)\n        message = (\n            f"Open Executive context for canonical work item {state.ref}.\\n"\n            f"Advisory source: {agent.title}.\\n"\n            f"Canonical execution role: {execution_role_contract.name} ({execution_role_contract.lane}).\\n"\n            f"Change classification: {classification}.\\n\\n"\n            f"{canonical_prompt}\\n\\n"\n            f"Executive objective/context:\\n{request.task.strip()}\\n"\n            + (f"\\nExecutive recommendation:\\n{recommendation}\\n" if recommendation else "")\n            + "\\nDo not change ownership outside the canonical handoff/ack/progress path. Process this existing work item in its current lane and update codex-web/GitLab state as the contract requires."\n        )\n        result = await self.host._dispatch_event_to_binding(binding, message, "executive-work-item")\n        effective_thread_id = binding.thread_id\n        if isinstance(result, dict):\n            effective_thread_id = result.get("newThreadId") or result.get("threadId") or binding.thread_id\n        public_state = self.host._work_item_state_public(state)\n        return {\n            "ok": True,\n            "agentId": agent.id,\n            "agentTitle": agent.title,\n            "executionRole": execution_role_contract.public(),\n            "changeClassification": request.change_classification,\n            "projectId": project.id,\n            "threadId": effective_thread_id,\n            "createdNewThread": False,\n            "turn": result,\n            "approvalPolicy": binding.approval_policy,\n            "sandbox": binding.sandbox,\n            "dispatchMode": "canonical-work-item",\n            "workItemRef": state.ref,\n            "canonicalWorkItem": public_state,\n        }\n\n'''
          if delegate_marker not in s: raise SystemExit('delegate marker missing')
          s = s.replace(delegate_marker, helper + delegate_marker, 1)

          old = '''        agent = _agent(request.agent_id)\n        execution_role_contract = execution_role(request.execution_role_id)\n        if request.execution_role_id and execution_role_contract is None:\n            raise HTTPException(status_code=422, detail=f"Unknown execution role: {request.execution_role_id}")\n        if execution_role_contract is None:\n            execution_role_contract = route_execution_role(request.task, agent.id)\n        company = self.store.company()\n        project = self.host._project(request.project_id)\n        sandbox = request.sandbox or project.sandbox\n        approval_policy = request.approval_policy or project.approval_policy\n        model = request.model or project.model\n'''
          new = '''        agent = _agent(request.agent_id)\n        requested_role = execution_role(request.execution_role_id)\n        if request.execution_role_id and requested_role is None:\n            raise HTTPException(status_code=422, detail=f"Unknown execution role: {request.execution_role_id}")\n\n        work_item_state = None\n        execution_role_contract = requested_role\n        project_id = request.project_id\n        if request.work_item_ref:\n            work_item_state = self.host._work_item_state(request.work_item_ref)\n            split_brain = False\n            split_brain_finder = getattr(self.host, "_work_item_split_brain_findings", None)\n            if split_brain_finder:\n                split_brain = bool(split_brain_finder(work_item_state))\n            canonical_role = execution_role_for_work_item(work_item_state, split_brain=split_brain)\n            if requested_role is not None and requested_role.id != canonical_role.id:\n                owner = getattr(work_item_state, "current_owner", None) or getattr(work_item_state, "next_owner", None) or "unowned"\n                raise HTTPException(\n                    status_code=409,\n                    detail=(\n                        f"Canonical work item {work_item_state.ref} is currently routed to {canonical_role.name} "\n                        f"(owner={owner}, stage={work_item_state.current_stage}). "\n                        f"Requested execution role {requested_role.name} would bypass canonical ownership. "\n                        "Record the reassignment through codex-web handoff/ack/progress and GitLab labels first."\n                    ),\n                )\n            execution_role_contract = canonical_role\n            project_id = work_item_state.project_id or request.project_id\n\n        if execution_role_contract is None:\n            execution_role_contract = route_execution_role(request.task, agent.id)\n        company = self.store.company()\n        project = self.host._project(project_id)\n        if work_item_state is not None:\n            return await self._delegate_canonical_work_item(\n                request,\n                agent,\n                execution_role_contract,\n                work_item_state,\n                project,\n            )\n\n        sandbox = request.sandbox or project.sandbox\n        approval_policy = request.approval_policy or project.approval_policy\n        model = request.model or project.model\n'''
          if old not in s: raise SystemExit('delegate initial block missing')
          s = s.replace(old, new, 1)

          old = '''            "createdNewThread": created_new_thread or effective_thread_id != thread_id,\n            "turn": result,'''
          new = '''            "createdNewThread": created_new_thread or effective_thread_id != thread_id,\n            "turn": result,\n            "dispatchMode": "executive-thread",\n            "workItemRef": None,'''
          if old not in s: raise SystemExit('direct response anchor missing')
          s = s.replace(old, new, 1)
          p.write_text(s)

          # Composition: decorate all canonical work-item dispatches with the same contract registry.
          p = Path('codex_web/application.py')
          s = p.read_text()
          old = 'from codex_web.services.work_item_state import install_work_item_state_machine\n'
          new = old + 'from codex_web.services.work_item_contracts import install_work_item_contract_service\n'
          if old not in s: raise SystemExit('application import anchor missing')
          s = s.replace(old, new, 1)
          old = '''work_item_state_machine = install_work_item_state_machine(app, core, gitlab_client)\nwork_item_service = WorkItemService(core, gitlab_client, work_item_state_machine)\n'''
          new = '''work_item_state_machine = install_work_item_state_machine(app, core, gitlab_client)\nwork_item_contract_service = install_work_item_contract_service(app, core)\nwork_item_service = WorkItemService(core, gitlab_client, work_item_state_machine)\n'''
          if old not in s: raise SystemExit('application install anchor missing')
          s = s.replace(old, new, 1)
          p.write_text(s)

          # Executive UI: select an existing canonical work item; its owner/stage then controls role routing.
          p = Path('static/executive-ui.js')
          s = p.read_text()
          old = '''  const executionRoleId = drawer.querySelector('#executive-execution-role')?.value || null;\n  const changeClassification = drawer.querySelector('#executive-change-classification')?.value || null;'''
          new = '''  const executionRoleId = drawer.querySelector('#executive-execution-role')?.value || null;\n  const workItemRef = drawer.querySelector('#executive-work-item')?.value || null;\n  const changeClassification = drawer.querySelector('#executive-change-classification')?.value || null;'''
          if old not in s: raise SystemExit('UI delegate variables anchor missing')
          s = s.replace(old, new, 1)
          old = '''        execution_role_id: executionRoleId,\n        change_classification: changeClassification,'''
          new = '''        execution_role_id: executionRoleId,\n        work_item_ref: workItemRef,\n        change_classification: changeClassification,'''
          if old not in s: raise SystemExit('UI payload anchor missing')
          s = s.replace(old, new, 1)
          old = '''  const [agentData, contextData, projects] = await Promise.all([\n    execApi('/api/executive/agents'),\n    execApi('/api/executive/context'),\n    execApi('/api/projects'),\n  ]);'''
          new = '''  const [agentData, contextData, projects, workItemData] = await Promise.all([\n    execApi('/api/executive/agents'),\n    execApi('/api/executive/context'),\n    execApi('/api/projects'),\n    execApi('/api/work-items'),\n  ]);'''
          if old not in s: raise SystemExit('UI Promise.all anchor missing')
          s = s.replace(old, new, 1)
          old = '''  const projectSelect = drawer.querySelector('#executive-project');\n  const selectedProject = currentCodexProjectId(projects);'''
          new = '''  const projectSelect = drawer.querySelector('#executive-project');\n  const selectedProject = currentCodexProjectId(projects);'''
          if old not in s: raise SystemExit('UI project anchor missing')
          # Insert work item population after projects are populated.
          project_end = '''  projects.forEach((project) => {\n    const option = document.createElement('option');\n    option.value = project.id;\n    option.textContent = project.name;\n    if (project.id === selectedProject) option.selected = true;\n    projectSelect.appendChild(option);\n  });\n'''
          addition = project_end + '''\n  const workItemSelect = drawer.querySelector('#executive-work-item');\n  workItemSelect.innerHTML = '<option value="">No canonical work item</option>';\n  (workItemData.items || []).filter((item) => !item.closed_at).forEach((item) => {\n    const option = document.createElement('option');\n    option.value = item.ref;\n    option.dataset.projectId = item.project_id || '';\n    const owner = item.handoff?.status === 'pending' ? item.handoff.to_agent : (item.current_owner || item.next_owner || 'unowned');\n    option.textContent = `${item.ref} · ${item.current_stage} · ${owner}${item.title ? ` · ${item.title}` : ''}`;\n    workItemSelect.appendChild(option);\n  });\n'''
          if project_end not in s: raise SystemExit('UI project population anchor missing')
          s = s.replace(project_end, addition, 1)
          old = '''      <label>Execution role<select id="executive-execution-role"><option value="">Auto-route from objective</option></select></label>\n      <label>Change class<select id="executive-change-classification">'''
          new = '''      <label>Canonical work item<select id="executive-work-item"><option value="">No canonical work item</option></select></label>\n      <label>Execution role<select id="executive-execution-role"><option value="">Auto-route from objective</option></select></label>\n      <label>Change class<select id="executive-change-classification">'''
          if old not in s: raise SystemExit('UI work-item field anchor missing')
          s = s.replace(old, new, 1)
          old = '''  drawer.querySelector('#executive-agent').addEventListener('change', (event) => { executiveState.activeAgent = event.target.value; });\n'''
          new = old + '''  drawer.querySelector('#executive-work-item').addEventListener('change', (event) => {\n    const roleSelect = drawer.querySelector('#executive-execution-role');\n    const projectSelect = drawer.querySelector('#executive-project');\n    const selected = event.target.selectedOptions[0];\n    if (event.target.value) {\n      roleSelect.value = '';\n      roleSelect.disabled = true;\n      if (selected?.dataset.projectId) projectSelect.value = selected.dataset.projectId;\n      setExecutiveStatus(drawer, 'Execution role will follow canonical work-item owner/stage.');\n    } else {\n      roleSelect.disabled = false;\n    }\n  });\n'''
          if old not in s: raise SystemExit('UI event anchor missing')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          python /tmp/integrate.py
      - name: Remove one-shot workflow
        run: rm .github/workflows/integrate-executive-work-items.yml
      - name: Validate syntax
        run: |
          python -m py_compile codex_web/execution_contracts.py codex_web/services/work_item_contracts.py codex_web/executive.py codex_web/application.py
          node --check static/executive-ui.js
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add codex_web/execution_contracts.py codex_web/services/work_item_contracts.py codex_web/executive.py codex_web/application.py static/executive-ui.js .github/workflows/integrate-executive-work-items.yml
          git commit -m 'Integrate Open Executive with canonical work items'
          git push origin HEAD:feature/executive-agent-contracts
