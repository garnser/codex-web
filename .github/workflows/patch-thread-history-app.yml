name: patch thread history app integration

on:
  push:
    branches:
      - fix/explicit-thread-history

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Replace frontend monkey-patch dependencies
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('static/app.js')
          source = path.read_text()

          marker = 'function replacementFrom(value) {'
          helpers = '''function threadHistoryController() {
            return window.codexThreadHistory || null;
          }

          function scrollMessagesToBottom() {
            const messages = $("messages");
            if (!messages) return;
            const history = threadHistoryController();
            if (history?.requestBottomScroll) {
              history.requestBottomScroll(messages);
              return;
            }
            messages.scrollTo({ top: messages.scrollHeight, behavior: "auto" });
          }

          '''
          if helpers.strip() not in source:
              if marker not in source:
                  raise SystemExit('replacementFrom marker not found')
              source = source.replace(marker, helpers + marker, 1)

          old_load = '''async function loadThread(threadId) {
            state.threadId = threadId;
            updateWaitingFromState();
            renderTokenUsage();
            const settings = currentRunSettings();
            const threadOptions = selectedThreadTurnOptions(threadId);
            const qs = new URLSearchParams({
              project_id: state.projectId,
              sandbox: settings.sandbox,
              approval_policy: settings.approvalPolicy,
            });
            if (threadOptions.model) qs.set("model", threadOptions.model);
            if (threadOptions.reasoningEffort) qs.set("reasoning_effort", threadOptions.reasoningEffort);
            const data = await api(`/api/threads/${threadId}`);
            const thread = data.thread || data;
            hydrateThreadActivity(thread);
            await refreshQueueStatus(threadId);
            renderThread(thread);
            renderThreads();
            renderTokenUsage();
            updateWaitingFromState();
          }
          '''
          new_load = '''async function loadThread(threadId) {
            state.threadId = threadId;
            updateWaitingFromState();
            renderTokenUsage();
            const history = threadHistoryController();
            const readQs = new URLSearchParams();
            const messageLimit = history?.messageLimit?.(threadId);
            if (messageLimit) readQs.set("message_limit", String(messageLimit));
            const query = readQs.toString();
            const data = await api(`/api/threads/${threadId}${query ? `?${query}` : ""}`);
            const thread = data.thread || data;
            history?.recordThread?.(threadId, thread);
            hydrateThreadActivity(thread);
            await refreshQueueStatus(threadId);
            renderThread(thread);
            history?.afterThreadRendered?.(threadId, $("messages"));
            renderThreads();
            renderTokenUsage();
            updateWaitingFromState();
          }

          threadHistoryController()?.configure?.({ reloadThread: loadThread });
          '''
          if old_load not in source:
              raise SystemExit('loadThread block did not match expected source')
          source = source.replace(old_load, new_load, 1)

          legacy_scroll = '$("messages").scrollTop = $("messages").scrollHeight;'
          scroll_count = source.count(legacy_scroll)
          if scroll_count != 4:
              raise SystemExit(f'Expected 4 legacy scroll writes, found {scroll_count}')
          source = source.replace(legacy_scroll, 'scrollMessagesToBottom();')

          if 'window.fetch =' in source:
              raise SystemExit('app.js unexpectedly contains a window.fetch override')
          path.write_text(source)
          PY

      - name: Remove one-shot workflow and commit result
        shell: bash
        run: |
          rm .github/workflows/patch-thread-history-app.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add static/app.js .github/workflows/patch-thread-history-app.yml
          git commit -m 'Use explicit thread history API from app'
          git push origin HEAD:fix/explicit-thread-history
