<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Runtime enrollment fixture</title></head>
<body>
  <div id="execution-worker-management-assurance"></div>
  <div id="execution-worker-management-status"></div>
  <details id="execution-worker-enrollment-panel" open>
    <summary>Add runtime</summary>
    <input id="execution-worker-enrollment-identity" value="worker-service">
    <input id="execution-worker-enrollment-pool" value="remote">
    <input id="execution-worker-enrollment-expiry" value="300">
    <input id="execution-worker-enrollment-concurrency" value="1">
    <fieldset id="execution-worker-enrollment-capabilities">
      <input type="checkbox" value="git" checked>
      <input type="checkbox" value="command_execution" checked>
    </fieldset>
    <button id="create-execution-worker-enrollment">Create enrollment</button>
    <div id="execution-worker-enrollment-result"></div>
    <div id="execution-worker-enrollment-list"></div>
  </details>
  <button id="recover-stale-workers"></button>
  <button id="recover-expired-assignments"></button>
  <div id="execution-worker-list"></div>
  <div id="execution-assignment-list"></div>
  <script src="/static/execution_worker_management.js"></script>
</body>
</html>
