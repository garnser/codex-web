<!doctype html>
<html>
<head><meta charset="utf-8"><title>Execution preflight UI fixture</title></head>
<body>
  <div id="messages"></div>
  <script type="module">
    import { createExecutionPreflightUi } from "../../static/execution_preflight_ui.js";

    window.__apiCalls = [];
    window.__reloadCalls = [];
    window.__refreshCalls = [];
    window.__messages = [];

    function addMessage(title, text, kind, date) {
      const card = document.createElement("div");
      card.className = `message ${kind}`;
      const heading = document.createElement("h3");
      heading.textContent = title;
      const body = document.createElement("div");
      body.className = "body";
      body.textContent = text;
      card.append(heading, body);
      document.getElementById("messages").appendChild(card);
      window.__messages.push({ title, text, kind, date: date?.toISOString?.() || null });
      return card;
    }

    const repositoryBlocker = new URLSearchParams(location.search).get("repositoryBlocker");
    const blocker = repositoryBlocker === "unauthorized"
      ? {
          code: "repository_target_unauthorized",
          message: "explicit repository target is not bound to this Project",
          target_type: "repository",
          target_id: "repo-app",
        }
      : repositoryBlocker === "stale"
        ? {
            code: "repository_target_unauthorized",
            message: "explicit repository is not active",
            target_type: "repository",
            target_id: "repo-stale",
          }
        : {
            code: "worker_capability_missing",
            message: "command execution is unavailable",
            remediation: "Restore a qualified worker.",
          };

    const attempts = [{
      id: "preflight-thread-turn-1",
      correlation_id: "thread-turn-1",
      execution_id: "thread-turn-1",
      thread_id: "thread-1",
      replacement_thread_id: new URLSearchParams(location.search).has("replacement") ? "replacement-thread" : null,
      message: "make the requested change",
      status: "blocked",
      attempt_number: 2,
      execution_profile_id: "repository-write",
      repository_resource_id: "repo-app",
      read_only_repository_resource_ids: ["repo-docs"],
      sandbox: "workspace-write",
      approval_policy: "on-request",
      can_retry: true,
      retry_href: "/api/threads/thread-1/preflight-attempts/preflight-thread-turn-1/retry",
      created_at: 1800000000,
      updated_at: 1800000010,
      blockers: [blocker],
    }];
    const disposition = new URLSearchParams(location.search).get('disposition');
    if (disposition) {
      attempts[0].status = disposition;
      attempts[0].can_retry = !['queued', 'reconciliation_required', 'started'].includes(disposition);
      attempts[0].queued_turn_snapshot = {id:'original-queue-id', work_item_ref:'group/repo#78'};
      attempts[0].agent_profile_id = 'original-profile';
      attempts[0].agent_profile_revision = 6;
      if (new URLSearchParams(location.search).has('resumeRefusal')) {
        attempts[0].queued_resume_correlation = {runtime_version:'0.160.0', runtime_generation:'fixture-generation', rpc_request_id:'resume-rpc', assignment_id:'assignment-1', worker_id:'worker-1', fence:7, provider_native_session_id:'thread-1', snapshot_sha256:'fixture-digest'};
        attempts[0].queued_resume_evidence = {outcome:'archived_refusal'};
        attempts[0].can_retry = false;
        attempts[0].can_reconcile_prestart = true;
        attempts[0].reconcile_prestart_href = '/api/threads/thread-1/preflight-attempts/preflight-thread-turn-1/reconcile-prestart';
      }
      if (new URLSearchParams(location.search).has('knownRefusal')) {
        attempts[0].can_reconcile_prestart = true;
        attempts[0].reconcile_prestart_href = '/api/threads/thread-1/preflight-attempts/preflight-thread-turn-1/reconcile-prestart';
      }
      if (new URLSearchParams(location.search).has('retireEligible')) {
        attempts[0].can_retire_scheduling = true;
        attempts[0].retire_scheduling_href = '/api/threads/thread-1/preflight-attempts/preflight-thread-turn-1/retire-scheduling';
      }
      if (new URLSearchParams(location.search).has('retired')) {
        attempts[0].can_retry = false;
        attempts[0].can_retire_scheduling = false;
        attempts[0].scheduling_retirement = {
          state: 'retired', native_outcome: 'unknown', work_item_ref: 'group/repo#78',
          source_state: 'merged', canonical_stage: 'closed',
        };
      }
      if (disposition === 'started') attempts[0].queued_start_receipt = {
        provider_native_turn_id:'actual-native-turn', provider_id:'openai', runtime_id:'codex',
        requested_execution_id:'original-request-execution', execution_id:'actual-bootstrap-execution'};
      if (new URLSearchParams(location.search).has('nativeCorrelation')) {
        attempts[0].queued_start_correlation = {
          schema_version:'1.0', runtime_generation:'generation-original', rpc_request_id:'rpc-original',
          organization_id:'org-original', workspace_id:'workspace-original', project_id:'project-original',
          actor_identity_id:'original-actor', assignment_id:'original-assignment', worker_id:'original-worker',
          fence:7, provider_native_session_id:'original-session', snapshot_sha256:'a'.repeat(64),
          assignment_resource_ids:['repo-app', 'repo-docs']
        };
        if (new URLSearchParams(location.search).has('positiveEvidence')) {
          attempts[0].queued_start_evidence = {provider_native_turn_id:'actual-native-turn'};
          attempts[0].can_reconcile_prestart = disposition !== 'started';
          attempts[0].reconcile_prestart_href = '/api/threads/thread-1/preflight-attempts/preflight-thread-turn-1/reconcile-prestart';
        }
      }
    }

    const batches = [];
    const batchPhase = new URLSearchParams(location.search).get('batch');
    if (batchPhase) {
      attempts[0].notification_batch_id = 'fixture-batch';
      attempts[0].notification_batch_href = '/api/threads/thread-1/notification-batches/fixture-batch';
      // Deliberately stale individual flags must not expose replay actions.
      attempts[0].can_retry = true;
      attempts[0].can_retire_scheduling = true;
      attempts[0].can_reconcile_prestart = true;
      batches.push({id:'fixture-batch',phase:batchPhase,original_count:2,oldest_age_seconds:600,
        outcome_counts:new URLSearchParams(location.search).has('batchOutcomes') ? {
          reconciled:1,follow_up_required:0,unresolved:1} : null,
        can_review_recovery:new URLSearchParams(location.search).has('batchRecovery'),
        can_capture_results:new URLSearchParams(location.search).has('batchCapture'),
        can_review_processing:new URLSearchParams(location.search).has('batchProcessing'),
        oldest_created_at:1800000000,original_ids:['original-one','original-two'],
        recovery_state:batchPhase==='released' ? 'released_to_original_queue' : 'batch_reconciliation_required',
        project_id:'project-a',organization_id:'org-a',workspace_id:'workspace-a',
        agent_profile_id:'original-profile',agent_profile_revision:6,execution_profile_id:'repository-write',
        repository_resource_id:'repo-app',writable_repository_resource_ids:['repo-app'],
        read_only_repository_resource_ids:[],detail_href:attempts[0].notification_batch_href,
        native_receipt:batchPhase==='native_input_started' ? {
          provider_native_turn_id:'shared-native-turn',provider_id:'fixture-provider',runtime_id:'fixture-runtime',
          requested_execution_id:'fixture-batch',execution_id:'shared-native-execution'} : null});
    }

    if (new URLSearchParams(location.search).has('operatorAdmission')) {
      attempts[0].can_admit_original = true;
      attempts[0].operator_admission_href = '/fixture/operator-admission';
    }
    if (new URLSearchParams(location.search).has('assignmentExhausted')) {
      attempts[0].blockers = [{code:'procedure_assignment_exhausted',
        message:'Assignment procedure history is full.',target_type:'execution_assignment',target_id:'exhausted-assignment'}];
    }
    if (new URLSearchParams(location.search).has('renewalUnknown')) {
      attempts[0].status = 'reconciliation_required';
      attempts[0].can_retry = false;
      attempts[0].queued_turn_snapshot = null;
      attempts[0].blockers = [{code:'native_start_outcome_unknown',
        message:'Native resume or input requires authoritative reconciliation.'}];
    }
    const api = async (path, options = {}) => {
      window.__apiCalls.push({ path, method: options.method || "GET" });
      if (path === '/fixture/operator-admission') {
        return {queued_turn_id:'original-queue-id',project_id:'project-a',source:'gitlab',
          original_actor_id:'original-admin',agent_profile_id:'original-profile',agent_profile_revision:6,
          execution_profile_id:'repository-write',writable_repository_resource_ids:['repo-app'],
          read_only_repository_resource_ids:['repo-docs'],reply_target:null,snapshot_sha256:'a'.repeat(64),queue_sha256:'b'.repeat(64)};
      }
      if (path.includes("/preflight-attempts?")) return { items: attempts };
      if (path.endsWith('/notification-batches/fixture-batch/processing')) {
        if (new URLSearchParams(location.search).has('processingDenied')) throw new Error('Current authority denied or installed feature unavailable');
        const item={original_id:'original-one',outcome:'follow_up_required',
          expected_processing_sha256:'a'.repeat(64),can_process:true,processing_state:'ready',blockers:[],
          evidence_ids:['fixture-evidence'],verification_ids:['fixture-independent-review'],
          follow_up:{ref:'fixture/repo#1',current_owner:'fixture-owner',next_action:'Review exact work'},
          reply:{state:'preview',destination:{provider:'slack',external_conversation_id:'fixture-room'},
            delivery_state:'not_sent',provider_receipt_id:null,text:'Reviewed result <img src=x onerror="window.__unsafe=true">'}};
        if (options.method==='POST') {
          window.__processingBody=JSON.parse(options.body);
          if (new URLSearchParams(location.search).has('holdProcessing')) return new Promise((resolve,reject)=>{window.__finishProcessing={resolve,reject};});
          if (new URLSearchParams(location.search).has('processingConflict')) throw new Error('Reviewed proof changed');
          return {original:{...item,processing_state:'processed_current',can_process:false}};
        }
        if (new URLSearchParams(location.search).has('processingStale')) {
          item.can_process=false;item.processing_state='historical_requires_reconciliation';item.blockers=['evidence_inactive_or_expired'];
        }
        if (new URLSearchParams(location.search).has('holdProcessingPreview')) {
          return new Promise((resolve,reject)=>{window.__finishProcessingPreview={resolve:()=>resolve({originals:[item]}),reject};});
        }
        return {originals:[item]};
      }
      if (path.endsWith('/notification-batches/fixture-batch/results')) {
        window.__captureBody=JSON.parse(options.body);
        if (new URLSearchParams(location.search).has('captureDenied')) throw new Error('Canonical result is unavailable or capture authority is denied');
        if (new URLSearchParams(location.search).has('holdCapture')) return new Promise((resolve,reject)=>{window.__finishCapture={resolve,reject};});
        return {evidence_ids:['fixture-captured-one','fixture-captured-two'],independently_verified:false};
      }
      if (path.endsWith('/notification-batches/fixture-batch/recovery')) {
        if (new URLSearchParams(location.search).has('recoveryDenied')) throw new Error('Current Role authority denies restoration');
        if (options.method==='POST') {
          window.__recoveryBody=JSON.parse(options.body);
          if (new URLSearchParams(location.search).has('holdRecovery')) return new Promise((resolve,reject)=>{window.__finishRecovery={resolve,reject};});
          if (new URLSearchParams(location.search).has('recoveryConflict')) throw new Error('Reviewed admission changed');
          return {ok:true,state:'released',threadId:'replacement-thread',native_started:false};
        }
        return {expected_admission_sha256:'a'.repeat(64),original_count:2,original_ids:['original-one','original-two'],
          original_thread_id:'thread-1',target_thread_id:'replacement-thread',
          effect:'Return exact originals to the queue without starting native work.',
          can_restore:!new URLSearchParams(location.search).has('recoveryUnknown'),
          blocker:'Native outcome remains unknown.'};
      }
      if (path.includes('/notification-batches/')) {
        if (new URLSearchParams(location.search).has('holdBatchDetail')) {
          return new Promise((resolve,reject) => {window.__finishBatchDetail={resolve,reject};});
        }
        if (new URLSearchParams(location.search).has('deniedBatchDetail')) throw new Error('Batch unavailable in this scope');
        return {control_snapshot:new URLSearchParams(location.search).has('batchControls') ? {
          agent_profile_record_id:'fixture-profile-record',execution_definition_ref:{definition_id:'execution.profiles.default',revision:4},
          authority_definition_ref:{definition_id:'authority.roles.default',revision:7},
          configuration_pins_json:[JSON.stringify({key:'execution.notification_batches.enabled',value:true,record_id:'fixture-config',revision:3})],
          max_members:3,max_context_bytes:65536} : null,
          originals:[{original:{id:'original-one',execution_id:'requested-one',created_at:1800000000,
          source:'gitlab',work_item_ref:'fixture/repo#1',thread_id:'original-thread',
          message:'Full original <img src=x onerror="window.__unsafe=true"> body'},
          admitted_route:{thread_id:'thread-1'},retained_status:'reconciliation_required',
          outcome:new URLSearchParams(location.search).has('batchOutcomes') ? 'reconciled' : 'unresolved',
          candidate_evidence_ids:new URLSearchParams(location.search).has('batchCapture') ? ['fixture-unreviewed-proposal'] : [],
          evidence_ids:['fixture-evidence'],verification_ids:['fixture-independent-review'],blockers:[]},
          ...(new URLSearchParams(location.search).has('batchOutcomes') ? [{original:{id:'original-two',created_at:1800000000,
            message:'Second full notification'},retained_status:'reconciliation_required',outcome:'unresolved',
            evidence_ids:[],verification_ids:[],blockers:['review_not_verified_or_conflicting']}] : [])]};
      }
      if (path.includes('/notification-batches')) {
        if (path.includes('?after=')) {
          if (new URLSearchParams(location.search).has('deniedBatchHistory')) throw new Error('Older history unavailable');
          return {items:[{...batches[0],id:'fixture-older-batch',phase:'released',
            original_ids:['older-one','older-two'],recovery_state:'released_to_original_queue'}],next_cursor:null};
        }
        return {items:batches,next_cursor:new URLSearchParams(location.search).has('pagedBatch') ? 'fixture-cursor' : null,
          queue:new URLSearchParams(location.search).has('batchQueue') ? {
            original_count:6,provider_pinned_count:1,without_provider_pin_count:5,oldest_age_seconds:7200
          } : null};
      }
      if (path.endsWith('/reconcile-prestart')) return {ok:true, threadId:'thread-1'};
      if (path.endsWith('/retire-scheduling')) return {ok:true, threadId:'thread-1'};
      if (path.endsWith("/retry")) {
        if (new URLSearchParams(location.search).has("holdRetry")) {
          return new Promise((resolve, reject) => { window.__finishRetry = { resolve, reject }; });
        }
        return { ok: true, threadId: new URLSearchParams(location.search).has("replacement") ? "replacement-thread" : "thread-1" };
      }
      throw new Error(`unexpected path: ${path}`);
    };

    window.__ui = createExecutionPreflightUi({
      api,
      addMessage,
      loadThread: async (threadId) => window.__reloadCalls.push(threadId),
      scheduleRefresh: (delay) => window.__refreshCalls.push(delay),
      logEvent: () => {},
    });
    await window.__ui.load("thread-1");
    window.__ui.render("thread-1");
    window.__ready = true;
  </script>
</body>
</html>
